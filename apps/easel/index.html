<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easel</title>
<link rel="stylesheet" href="/platinum/popup.css">
<style>
/* Platinum values match the exe desktop (docs/platinum.md); shared blocks
   copied whole from Planet (the sidebar, sheets, alert, scrollbars), the
   desktop (the tab control, the movie controller) and Weather (the
   disclosure triangle) */
:root {
  --black: #262626;
  --g200: #eee; --g300: #ddd; --g400: #ccc; --g500: #bbb; --g600: #999;
  --hl: #333399; --red: #cc3333; --green: #1f9e33;
  --font: "Charcoal", "Chicago", "Geneva", "Lucida Grande", "Lucida Sans", Geneva, Verdana, sans-serif;
  --mono: "Berkeley Mono", "Monaco", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; font: 12px/1.45 var(--font); color: var(--black); background: var(--g200);
  user-select: none; cursor: default; overflow: hidden; display: flex; flex-direction: column; }

button { font: inherit; cursor: default; }
button.ghost { background: var(--g300); color: var(--black);
  border: 1px solid var(--black); border-radius: 3px;
  padding: 2px 13px; font-size: 12px; line-height: 14px; font-weight: bold; height: 20px;
  box-shadow: inset 1px 1px 0 var(--g300), inset -1px -1px 0 #777,
    inset 2px 2px 0 #fff, inset -2px -2px 0 #aaa; }
button.ghost:active { background: #666; color: #fff;
  box-shadow: inset 1px 1px 0 #444, inset -1px -1px 0 #888,
    inset 2px 2px 0 #555, inset -2px -2px 0 #777; }
button.ghost:disabled { color: #777; border-color: #888; background: var(--g300); box-shadow: none; }
button.ghost.default { outline: 2px solid var(--black); outline-offset: 1px; border-radius: 4px; }
button.ghost.danger { color: #7a1010; }

/* the control row at the dialog guidelines' numbers; on a phone it slides
   sideways rather than wrap (Paint's row) */
#bar { display: flex; align-items: center; gap: 12px; padding: 10px 12px; flex: none;
  overflow-x: auto; scrollbar-width: none; }
#bar::-webkit-scrollbar { display: none; }
#bar button { flex: none; }
#bar .sp { flex: 1; min-width: 0; }
#bar .gap { width: 4px; flex: none; }
/* a phone shows the action row as glyphs (the Hub's Find, Refresh): 14px
   pixel art, whole device pixels at 1x, 2x and 3x, geometricPrecision between */
#bar .ix { display: none; }
#bar .ix .k { fill: currentColor; }
body.mobile #bar button.g { width: 32px; padding: 0; }
body.mobile #bar button.g .t { display: none; }
body.mobile #bar button.g .ix { display: block; margin: 0 auto; }
@media (min-resolution: 1.01dppx) and (max-resolution: 1.99dppx) { #bar .ix { shape-rendering: geometricPrecision; } }

/* two columns: the studios on the window colour (Planet's sidebar), the
   chosen studio under a tab control; the seam one line, a grip astride it */
#cols { flex: 1; min-height: 0; display: flex; border-top: 1px solid var(--black); }
#studios { width: 220px; flex: none; background: var(--g400); border-right: 1px solid var(--black);
  overflow-y: auto; overflow-x: hidden; padding: 4px 0; outline: none; }
#studios::-webkit-scrollbar-track:vertical { border-left: 1px solid var(--black); }
.st { height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 8px; }
.st .th { width: 36px; height: 27px; flex: none; display: block; border: 1px solid var(--black);
  background: #fff; object-fit: cover; }
.st .th.none { background: #fff; }
.st .tx { flex: 1; min-width: 0; }
.st .nm { display: flex; align-items: center; gap: 5px; line-height: 15px; }
.st .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st .sub { font-size: 10px; line-height: 13px; color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st.sel { background: var(--hl); color: #fff; }
.st.sel .sub { color: #ddd; }
/* green means live: the Chat list's 6px pulsing dot while a painter works */
.dot { width: 6px; height: 6px; border-radius: 3px; flex: none; background: var(--green); display: none; }
.st.live .dot { display: block; animation: pulse 1.6s ease-in-out infinite; }
.dot.still { animation: none !important; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .st.live .dot, .ev-pending .dot { animation: none; } }
#st-empty { padding: 10px; color: #555; font-size: 11px; line-height: 16px; }
.grip { width: 6px; margin: 0 -3px; flex: none; cursor: col-resize; z-index: 2; touch-action: none; }

#main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 8px 10px 10px; }
/* the desktop's tab control (Configuration, the Log Viewer) */
.tabbar { display: flex; align-items: flex-start; padding: 0 4px; position: relative; z-index: 2; flex: none; }
.tab {
  height: 22px; color: #000; font-size: 11px; font-weight: bold; line-height: 14px;
  text-align: center; padding: 0 2px; position: relative; white-space: nowrap;
  border-style: solid; border-width: 8px 14px 0 14px;
  border-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='22'><path d='M4.5 23 L11 5.5 Q11.8 1.5 14 1.5 L30 1.5 Q32.2 1.5 33 5.5 L39.5 23' fill='%23ccc' stroke='%23000'/><path d='M6.2 23 L12 5.8 Q12.6 2.5 14 2.5 L29.5 2.5' fill='none' stroke='%23ddd'/><path d='M30 2.5 Q31.6 2.5 32.2 5.8 L37.8 23' fill='none' stroke='%23aaa'/></svg>") 8 14 0 14 fill stretch;
}
.tab + .tab { margin-left: -7px; }
.tab.active {
  height: 25px; margin-bottom: -3px; z-index: 3;
  border-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='25'><path d='M3.8 25 L11 5.5 Q11.8 1.5 14 1.5 L30 1.5 Q32.2 1.5 33 5.5 L40.2 25 Z' fill='%23eee'/><path d='M4.9 22 L11 5.5 Q11.8 1.5 14 1.5 L30 1.5 Q32.2 1.5 33 5.5 L39.1 22' fill='none' stroke='%23000'/><path d='M6.6 22 L12 5.8 Q12.6 2.5 14 2.5 L29.5 2.5' fill='none' stroke='%23fff'/><path d='M30 2.5 Q31.6 2.5 32.2 5.8 L37.4 22' fill='none' stroke='%23bbb'/></svg>") 8 14 0 14 fill stretch;
}
.tabpanel { position: relative; border: 1px solid var(--black); background: var(--g200);
  padding: 10px; flex: 1; min-height: 0; display: flex; flex-direction: column;
  box-shadow: inset 1px 1px 0 var(--g400), inset 2px 2px 0 #fff, inset -1px -1px 0 var(--g500); }
/* the panes stack, the hidden ones only invisible, so each keeps its
   scroll place (display:none would drop it) */
#panes { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.pane { position: absolute; inset: 0; display: flex; flex-direction: column; }
.pane.off { visibility: hidden; }
.prow { display: flex; align-items: center; gap: 8px; flex: none; min-height: 20px; }
.prow.top { margin-bottom: 8px; }
.prow.bot { margin-top: 10px; gap: 12px; }
.prow .sp { flex: 1; min-width: 0; }
.prow label { font-size: 11px; }
.meta { font-size: 11px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#nosel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #777; text-align: center; padding: 0 24px; line-height: 16px; background: var(--g200); z-index: 1; }

/* framed white scrollers (.listbox): the bar's black edge is the frame's
   right line, its last arrow the 14px borderless cell on the bottom line */
.box { background: #fff; border: 1px solid var(--black); border-right: 0;
  box-shadow: -1px -1px 0 var(--g600), 1px 1px 0 #fff; }
.scroller { flex: 1; min-height: 0; overflow-y: scroll; overflow-x: hidden; position: relative; }
.scroller::-webkit-scrollbar-button:vertical:end:increment:enabled { height: 14px; border-top: 0; border-bottom: 0; }
.note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #777;
  text-align: center; line-height: 16px; width: max-content; max-width: calc(100% - 32px); pointer-events: none; }

/* Canvas */
#cv-box { flex: 1; min-height: 0; position: relative; border-right: 1px solid var(--black); overflow: hidden; }
#cv-img { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px);
  object-fit: contain; display: block; }
#cv-img[hidden] { display: none; }
#cv-busy { position: absolute; right: 8px; top: 8px; font-size: 11px; line-height: 16px; color: #333; background: rgba(255,255,255,.9);
  border: 1px solid var(--g600); padding: 1px 6px; display: none; max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#cv-busy.on { display: block; }

/* Session: the painter's own record, one row an event */
#se-list { position: relative; }
#se-list.f-words .ev-paint, #se-list.f-words .ev-read, #se-list.f-words .ev-tool, #se-list.f-words .ev-think,
#se-list.f-looks .ev:not(.ev-look) { display: none; }
.ev { display: flex; gap: 8px; padding: 5px 8px 5px 6px; border-top: 1px solid #e2e2e2; }
.ev:first-child { border-top: 0; }
.ev > .t { flex: none; width: 36px; color: #888; font-size: 10px; line-height: 16px; text-align: right;
  font-variant-numeric: tabular-nums; }
.ev > .b { flex: 1; min-width: 0; }
.ev .hd { display: flex; align-items: center; gap: 5px; line-height: 16px; min-width: 0; }
.ev .hd b { flex: none; }
.ev .hd .sub { flex: 1; min-width: 0; font: 11px/16px var(--mono); color: #555;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev pre { margin: 3px 0 0; font: 11px/15px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
  user-select: text; cursor: text; }
.ev pre.code { background: #f6f6f1; border: 1px solid var(--g500); padding: 4px 6px; }
.ev pre.rep { color: #555; }
.ev .err { color: #9a1b1b; }
.ev code { font: 11px var(--mono); }
.ev-say .b { white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; cursor: text; line-height: 16px; }
.ev-think .b, .ev-read .b, .ev-tool .hd, .ev-compact .b { color: #888; font-size: 11px; line-height: 16px; }
.ev-note .q { margin-top: 2px; padding-left: 8px; border-left: 2px solid var(--g600); white-space: pre-wrap;
  overflow-wrap: anywhere; user-select: text; cursor: text; line-height: 16px; }
.ev-look .shots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.ev-look .shots img { display: block; border: 1px solid var(--black); background: var(--g200); height: auto; max-width: 100%; }
.ev-start .b, .ev-result .b, .ev-limit .b { line-height: 16px; }
.ev-result { background: #f0f0fa; }
.ev-result .q { white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; cursor: text; margin-top: 2px; }
.ev-limit .b { color: #9a1b1b; }
.ev-pending .hd { color: #555; }
.ev-pending .dot { display: block; animation: pulse 1.6s ease-in-out infinite; }
/* the Finder list view's disclosure triangle, sampled from Mac OS 9:
   lavender face, black outline, a one-pixel gray shadow to the lower right */
.tri { flex: none; width: 12px; height: 12px; background: no-repeat center;
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="9" height="12" shape-rendering="crispEdges"><path fill="%23000000" d="M0 0h1v1H0zM0 1h1v1H0zM1 1h1v1H1zM0 2h1v1H0zM2 2h1v1H2zM0 3h1v1H0zM3 3h1v1H3zM0 4h1v1H0zM4 4h1v1H4zM0 5h1v1H0zM5 5h1v1H5zM0 6h1v1H0zM4 6h1v1H4zM0 7h1v1H0zM3 7h1v1H3zM0 8h1v1H0zM2 8h1v1H2zM0 9h1v1H0zM1 9h1v1H1zM0 10h1v1H0z"/><path fill="%23ccccff" d="M1 2h1v1H1zM1 3h1v1H1zM1 4h1v1H1zM1 5h1v1H1zM1 6h1v1H1zM1 7h1v1H1z"/><path fill="%239999ff" d="M2 3h1v1H2zM2 4h1v1H2zM3 4h1v1H3zM2 5h1v1H2zM3 5h1v1H3zM2 6h1v1H2zM1 8h1v1H1z"/><path fill="%236666cc" d="M4 5h1v1H4zM3 6h1v1H3zM2 7h1v1H2z"/><path fill="%23888888" d="M5 6h1v1H5zM4 7h1v1H4zM3 8h1v1H3zM2 9h1v1H2zM1 10h1v1H1z"/><path fill="%23bbbbbb" d="M6 6h1v1H6zM5 7h1v1H5zM4 8h1v1H4zM3 9h1v1H3zM2 10h1v1H2zM1 11h1v1H1z"/></svg>'); }
.ev.open .tri { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="9" shape-rendering="crispEdges"><path fill="%23000000" d="M0 0h1v1H0zM1 0h1v1H1zM2 0h1v1H2zM3 0h1v1H3zM4 0h1v1H4zM5 0h1v1H5zM6 0h1v1H6zM7 0h1v1H7zM8 0h1v1H8zM9 0h1v1H9zM10 0h1v1H10zM1 1h1v1H1zM9 1h1v1H9zM2 2h1v1H2zM8 2h1v1H8zM3 3h1v1H3zM7 3h1v1H7zM4 4h1v1H4zM6 4h1v1H6zM5 5h1v1H5z"/><path fill="%23ccccff" d="M2 1h1v1H2zM3 1h1v1H3zM4 1h1v1H4zM5 1h1v1H5zM6 1h1v1H6zM7 1h1v1H7z"/><path fill="%239999ff" d="M8 1h1v1H8zM3 2h1v1H3zM4 2h1v1H4zM5 2h1v1H5zM6 2h1v1H6zM4 3h1v1H4zM5 3h1v1H5z"/><path fill="%23888888" d="M10 1h1v1H10zM9 2h1v1H9zM8 3h1v1H8zM7 4h1v1H7zM6 5h1v1H6z"/><path fill="%23bbbbbb" d="M11 1h1v1H11zM10 2h1v1H10zM9 3h1v1H9zM8 4h1v1H8zM7 5h1v1H7zM6 6h1v1H6z"/><path fill="%236666cc" d="M7 2h1v1H7zM6 3h1v1H6zM5 4h1v1H5z"/></svg>'); }
.ev .code { display: none; }
.ev.open .code { display: block; }

/* Journal, Code: printouts */
#jn, #code { margin: 0; padding: 6px 8px; user-select: text; cursor: text; white-space: pre-wrap; overflow-wrap: anywhere; }
#jn { font: 12px/16px var(--font); }
#code { font: 11px/15px var(--mono); }
#code .ch { display: block; color: #888; border-top: 1px solid var(--g500); margin: 6px 0 2px; padding-top: 2px;
  font: 10px/14px var(--font); user-select: none; }
#code .ch:first-child { border-top: 0; margin-top: 0; }

/* Brief and the console's chunk: the sunken field */
textarea.field { width: 100%; padding: 4px 6px; color: var(--black); background: #fff; border: 1px solid var(--black);
  border-radius: 0; user-select: text; cursor: text; resize: none; box-shadow: -1px -1px 0 #999, 1px 1px 0 #fff; }
textarea.field:focus { outline: 2px solid #9999fe; outline-offset: 0; }
textarea.field:disabled { background: var(--g200); color: #777; }
#br { flex: 1; min-height: 0; font: 12px/16px var(--font); }
#ez-in { height: 118px; flex: none; font: 11px/15px var(--mono); margin-top: 8px; }
#ez-out { padding: 4px 0; }
.ez { padding: 4px 8px; border-top: 1px solid #e2e2e2; }
.ez:first-child { border-top: 0; }
.ez pre { margin: 0; font: 11px/15px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; cursor: text; }
.ez pre.in { color: #333399; }
.ez pre.out { color: #444; }
.ez pre.err { color: #9a1b1b; }
.ez img { display: block; margin-top: 4px; border: 1px solid var(--black); max-width: 100%; height: auto; }
.ez.sys { color: #777; font-size: 11px; line-height: 16px; }
.check { display: flex; align-items: center; gap: 5px; font-size: 11px; }
input[type=checkbox] { appearance: none; width: 12px; height: 12px; margin: 0; border: 1px solid var(--black); flex: none;
  background: #fff; box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #bbb; }
input[type=checkbox]:checked { background: #fff url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" shape-rendering="crispEdges"><path fill="black" d="M0 0h2v2H0zM2 2h2v2H2zM4 4h2v2H4zM6 2h2v2H6zM8 0h2v2H8zM2 6h2v2H2zM6 6h2v2H6zM0 8h2v2H0zM8 8h2v2H8z"/></svg>') center no-repeat; }
input[type=checkbox]:disabled { border-color: #888; }
.check.dis { color: #888; }

/* Replay: the desktop's movie controller, traced from Mac OS 9 (MVQ) */
#rp-box { flex: 1; min-height: 0; position: relative; background: #000; border: 1px solid var(--black); border-bottom: 0; }
#rp-box video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
#rp-box .note { color: #aaa; }
.mv-ctl { position: relative; height: 16px; flex: none; display: flex; border: 1px solid var(--black); border-top: 0; box-sizing: content-box; }
.mv-ctl svg { display: block; }
.mv-btn { flex: none; width: 15px; height: 16px; padding: 0; margin: 0; border: 0; background: none; }
.mv-btn:active { filter: brightness(.82); }
.mv-sep, .mv-edge, .mv-end { flex: none; width: 1px; }
.mv-silent .mv-snd, .mv-silent .mv-snd-sep { display: none; }
.mv-track { flex: 1; position: relative; overflow: hidden; }
.mv-capl { position: absolute; left: 0; top: 0; }
.mv-capr { position: absolute; right: 0; top: 0; }
.mv-thumb { position: absolute; top: 0; left: 0; width: 13px; height: 16px; }
.mv-ctl.off { pointer-events: none; filter: grayscale(1) opacity(.6); }

/* 15px status bar, text only */
#status { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--black);
  background: var(--g300); font-size: 11px; color: #333; padding: 0 20px 0 8px; height: 15px; flex: none;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.6), inset -1px -1px 0 #aaa; overflow: clip; }
#st-l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#st-l.err { color: var(--red); }
#st-r { flex: none; }

#grow { position: fixed; right: 0; bottom: 0; width: 15px; height: 15px; touch-action: none; z-index: 6; }

/* Mac OS 9 scrollbars — the desktop's pixel-sampled spec (Notes' copy, through Planet) */
::-webkit-scrollbar { width: 15px; height: 15px; }
::-webkit-scrollbar-track:vertical { border-left: 1px solid var(--black);
  background: linear-gradient(to right, #777 0, #777 1px, #888 1px, #888 2px, #aaa 2px, #aaa 12px, #bbb 12px, #bbb 13px, #ccc 13px, #ccc 14px); }
::-webkit-scrollbar-thumb:vertical { border: 1px solid var(--black); border-right: 0;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="0" width="6" height="1" fill="%23ccccff"/><rect x="4" y="1" width="7" height="1" fill="%23333399"/><rect x="3" y="2" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="2" width="6" height="1" fill="%23ccccff"/><rect x="4" y="3" width="7" height="1" fill="%23333399"/><rect x="3" y="4" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="4" width="6" height="1" fill="%23ccccff"/><rect x="4" y="5" width="7" height="1" fill="%23333399"/><rect x="3" y="6" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="6" width="6" height="1" fill="%23ccccff"/><rect x="4" y="7" width="7" height="1" fill="%23333399"/></svg>') center no-repeat,
    linear-gradient(to right, #ccccff 0 1px, #9999ff 1px 13px, #6666cc 13px 14px);
  box-shadow: inset 0 1px 0 #ccccff, inset 0 -1px 0 #6666cc; }
::-webkit-scrollbar-thumb:vertical:active {
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="1" fill="%23ccccff"/><rect x="4" y="0" width="6" height="1" fill="%239999ff"/><rect x="4" y="1" width="7" height="1" fill="%23000066"/><rect x="3" y="2" width="1" height="1" fill="%23ccccff"/><rect x="4" y="2" width="6" height="1" fill="%239999ff"/><rect x="4" y="3" width="7" height="1" fill="%23000066"/><rect x="3" y="4" width="1" height="1" fill="%23ccccff"/><rect x="4" y="4" width="6" height="1" fill="%239999ff"/><rect x="4" y="5" width="7" height="1" fill="%23000066"/><rect x="3" y="6" width="1" height="1" fill="%23ccccff"/><rect x="4" y="6" width="6" height="1" fill="%239999ff"/><rect x="4" y="7" width="7" height="1" fill="%23000066"/></svg>') center no-repeat,
    linear-gradient(to right, #9999ff 0 1px, #6666cc 1px 13px, #333399 13px 14px);
  box-shadow: inset 0 1px 0 #9999ff, inset 0 -1px 0 #333399; }
:not(.scrolled-y)::-webkit-scrollbar-thumb:vertical {
  border-top-color: #ccccff; box-shadow: inset 0 -1px 0 #6666cc; }
:not(.scrolled-y)::-webkit-scrollbar-thumb:vertical:active {
  border-top-color: #9999ff; box-shadow: inset 0 -1px 0 #333399; }
.at-y-end::-webkit-scrollbar-thumb:vertical {

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const MOBILE = new URLSearchParams(location.search).has("mobile");
const APP = decodeURIComponent(location.pathname.split("/")[2] || "easel");
const API = "/v1/svc/art/v1";
const NAME = /^[a-z0-9][a-z0-9-]{0,47}$/;
const LS = k => "easel." + k;
const lsGet = k => { try { return localStorage.getItem(LS(k)); } catch (e) { return null; } };

// ---- the error log: what goes wrong here is written to exe-art's
// logs/error.log through the daemon (POST /v1/log), with where it happened,
// so it can be read and fixed later; the same error once in 10 s ----
const reported = new Map();
function report(level, msg, extra = {}) {
  msg = String(msg || "").slice(0, 4000);
  if (!msg) return;
  const key = level + "\u0000" + msg + "\u0000" + (extra.where || "");
  const now = Date.now();
  if (reported.get(key) > now - 10000) return;
  reported.set(key, now);
  // (an error while the page starts can come before sel, tab and view exist)
  let where = {};
  try { where = { studio: sel || "", tab, view }; } catch (e) {}
  const body = Object.assign(where, { level, msg, ua: navigator.userAgent, mobile: MOBILE }, extra);
  const headers = { "Content-Type": "application/json" };
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  // straight to fetch, never through api(): a failing log must not report itself
  try { fetch(API + "/log", { method: "POST", headers, body: JSON.stringify(body), keepalive: true }).catch(() => {}); } catch (e) {}
}
window.addEventListener("error", e => report("error", e.message || "script error", { where: "script", stack: e.error && e.error.stack || "", source: (e.filename || "") + ":" + e.lineno + ":" + e.colno }));
window.addEventListener("unhandledrejection", e => report("error", (e.reason && e.reason.message) || String(e.reason), { where: "promise", stack: e.reason && e.reason.stack || "" }));

async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers);
  if (TOKEN) opts.headers["Authorization"] = "Bearer " + TOKEN;
  opts.cache = "no-store";
  const url = path.startsWith("/v1/svc/") || path.startsWith("/v1/workspace") ? path : API + path;
  const where = (opts.method || "GET") + " " + url.replace(API, "");
  let r;
  try { r = await fetch(url, opts); }
  catch (e) { report("error", e.message || "the request failed", { where }); throw e; }

// its answer when ready, so a failure comes as {error, status} in a 200;

// opens (the whole log is painted again), and the call is made again until
// it is open. progress(words) shows how far it has got; stale() says the
// window has moved on, and the wait ends quietly (null).
async function easelCall(path, body, progress, stale) {
  for (;;) {
    const r = await json("POST", path, body);
    if (r && r.opening) {

      await new Promise(ok => setTimeout(ok, 1500));
      if (stale && stale()) return null;

const withToken = u => TOKEN ? u + (u.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN) : u;

// ---- state ----

// ---- the studio list ----

// ---- Canvas: the latest look, the finished picture, or a look of our own ----
const EASEL_VIEWS = new Set(["now", "value", "squint", "mirror", "relief", "gallery", "palette"]);

// ---- Session: the painter's record ----
async function loadSession() {
  const s = cur(); if (!s) return;
  if (seLoading) { seAgain = true; return; }
  if (seFor !== s.name) { seFor = s.name; seEvents = []; seNext = 0; $("#se-list").textContent = ""; seLoaded = false; }
  seLoading = true;
  const name = s.name;
  try {
    const r = await api("/studios/" + encodeURIComponent(name) + "/session?after=" + seNext);
    if (sel !== name || seFor !== name) return;
    const list = $("#se-list");
    const follow = !seLoaded || list.scrollTop >= list.scrollHeight - list.clientHeight - 8;
    $("#se-pending")?.remove();
    const frag = document.createDocumentFragment();
    for (const ev of r.events || []) { seEvents.push(ev); const row = evRow(ev, name); if (row) frag.append(row); }
    list.append(frag);

    else list.querySelector(":scope > .note")?.remove();

    case "think":

    case "paint": {

        `<pre class="code"></pre>${ev.reply ? `<pre class="rep">${esc(ev.reply)}</pre>` : ""}${err}</div>`;

        `${ev.turns ? " · " + plural(ev.turns, "turn") : ""}${ev.cost_usd ? " · $" + ev.cost_usd.toFixed(2) : ""}<div class="q"></div>${err}</div>`;

}

// ---- Brief ----
function loadBrief() {
  const s = cur(); if (!s || !detail || detail.name !== s.name) return;
  const ta = $("#br");
  const dirty = briefFor === s.name && ta.value !== briefText;
  if (briefFor !== s.name || (!dirty && briefText !== detail.brief)) { briefFor = s.name; briefText = detail.brief || ""; ta.value = briefText; }
  const locked = busy(s);
  ta.disabled = locked;
  $("#br-note").textContent = locked ? "The brief can’t change while the painter works." : s.started ? "A changed brief reaches the painter only if it reads BRIEF.md again." : "What the painter reads first.";
  briefButtons();
}
function briefButtons() {
  const s = cur(), dirty = $("#br").value !== briefText;
  $("#br-save").disabled = !s || busy(s) || !dirty;
  $("#br-revert").disabled = !dirty;
  $("#br-save").classList.toggle("default", dirty);
}
$("#br").addEventListener("input", briefButtons);
$("#br-revert").addEventListener("click", () => { $("#br").value = briefText; briefButtons(); });
$("#br-save").addEventListener("click", async () => {
  const s = cur(), text = $("#br").value;
  try { await json("PUT", "/studios/" + encodeURIComponent(s.name) + "/brief", { text }); briefText = text; if (detail) detail.brief = text; briefButtons(); setStatus("Brief saved."); }
  catch (e) { alertBox("The brief wasn’t saved.", e.message); }
});

// ---- Easel: a hand at the easel ----
function resetConsole() { $("#ez-out").textContent = ""; }
function ezLine(cls, text, img) {
  const out = $("#ez-out");
  const atEnd = out.scrollTop >= out.scrollHeight - out.clientHeight - 8;
  const d = document.createElement("div");
  if (cls === "sys") { d.className = "ez sys"; d.textContent = text; }
  else { d.className = "ez"; for (const [c, t] of cls) { const p = document.createElement("pre"); p.className = c; p.textContent = t; d.append(p); } }
  if (img) d.append(img);
  out.append(d);
  if (atEnd) out.scrollTop = out.scrollHeight;
}
function renderConsole() {
  const s = cur(); if (!s) return;
  const locked = busy(s) || s.state === "failed";
  for (const id of ["#ez-run", "#ez-look", "#ez-in", "#ez-scratch", "#ez-autolook"]) $(id).disabled = locked;
  $("#ez-close").disabled = locked;
  $("#ez-scratch-l").classList.toggle("dis", locked); $("#ez-look-l").classList.toggle("dis", locked);
  if (!$("#ez-out").children.length) {
    ezLine("sys", locked ? "The painter is at the easel. This console opens when it stops."
      : "Paint by hand: each chunk of Lua runs at this studio’s easel and joins the log, as a painter’s would. Guide… explains the calls; Run is Ctrl+Return.");
  }
}
async function ezRun() {
  const s = cur(), lua = $("#ez-in").value;
  if (!s || !lua.trim() || $("#ez-run").disabled) return;
  const scratch = $("#ez-scratch").checked;
  $("#ez-run").disabled = true;
  ezLine([["in", lua.trim()]]);
  try {
    let said = null;
    const r = await easelCall("/studios/" + encodeURIComponent(s.name) + "/do", { lua, scratch },
      words => { if (said !== words) { said = words; ezLine("sys", words); } }, () => sel !== s.name);
    if (!r) return;
    ezLine([["out", (r.reply || "").trim()]]);
    if ($("#ez-autolook").checked) await ezLook(true);
  } catch (e) { ezLine([["err", e.message]]); }
  finally { $("#ez-run").disabled = busy(cur()); }
}
async function ezLook(quiet) {
  const s = cur(); if (!s) return;
  const scratch = $("#ez-scratch").checked;
  try {
    let said = null;
    const r = await easelCall("/studios/" + encodeURIComponent(s.name) + "/look", scratch ? { scratch: true } : {},
      words => { if (said !== words) { said = words; ezLine("sys", words); } }, () => sel !== s.name);
    if (r && r.images && r.images[0]) {
      const img = document.createElement("img"), w = r.w || 1000, h = r.h || 700, tw = Math.min(360, w);
      img.width = tw; img.height = Math.round(tw * h / w); img.alt = "";
      img.src = fileURL(s.name, r.images[0], tw * DPR());
      ezLine(quiet ? "sys" : [["out", "look"]], quiet ? "" : null, img);
      shownFor = null; if (!scratch && view === "now") renderCanvas();
    }
  } catch (e) { ezLine([["err", e.message]]); }
}
$("#ez-run").addEventListener("click", ezRun);
// the studio's own easel guide, the one its painter reads
$("#ez-guide").addEventListener("click", async () => {
  const s = cur(); if (!s) return;
  let text;
  try { text = await loadText("notes/easel_guide.md"); } catch (e) { alertBox("The guide didn’t load.", e.message); return; }
  dialog(`<h2>The Easel Guide</h2><pre class="guide"></pre><div class="btns"><button class="ghost default" id="d-ok">OK</button></div>`, () => true);
  $("#dlg pre.guide").textContent = text || "This studio has no guide.";
});
$("#ez-look").addEventListener("click", () => ezLook(false));
$("#ez-close").addEventListener("click", async () => {
  const s = cur(); if (!s) return;
  try { await api("/studios/" + encodeURIComponent(s.name) + "/close", { method: "POST" }); ezLine("sys", "The easel is closed; the log keeps the painting."); }
  catch (e) { ezLine([["err", e.message]]); }
});
$("#ez-in").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ezRun(); } });
$("#ez-in").addEventListener("input", () => { const s = cur(); $("#ez-run").disabled = !s || busy(s) || !$("#ez-in").value.trim(); });

(function wireMovie() {
  const ctl = $("#mv"), v = $("#rp-box video");
  ctl.querySelector(".mv-edge").innerHTML = MVQ.edge; ctl.querySelector(".mv-end").innerHTML = MVQ.end;
  ctl.querySelector(".mv-snd").innerHTML = MVQ.snd; ctl.querySelector(".mv-play").innerHTML = MVQ.play;
  ctl.querySelectorAll(".mv-sep").forEach(s => s.innerHTML = MVQ.sep);
  ctl.querySelector(".mv-capl").innerHTML = MVQ.capl; ctl.querySelector(".mv-capr").innerHTML = MVQ.capr;
  ctl.querySelector(".mv-thumb").innerHTML = MVQ.thumb;
  ctl.querySelector(".mv-back").innerHTML = MVQ.back; ctl.querySelector(".mv-fwd").innerHTML = MVQ.fwd;
  const play = ctl.querySelector(".mv-play"), snd = ctl.querySelector(".mv-snd"),
    back = ctl.querySelector(".mv-back"), fwd = ctl.querySelector(".mv-fwd"),
    track = ctl.querySelector(".mv-track"), thumb = ctl.querySelector(".mv-thumb");
  // as an image (unlike inline markup) the SVG needs its namespace said
  track.style.background = `url('data:image/svg+xml;utf8,${encodeURIComponent(
    MVQ.ch.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" '))}') repeat-x`;
  // a replay is silent: the speaker shows only on evidence of sound
  const hasAudio = () => v.audioTracks ? v.audioTracks.length > 0
    : v.webkitAudioDecodedByteCount !== undefined ? v.webkitAudioDecodedByteCount > 0
    : v.mozHasAudio !== undefined ? !!v.mozHasAudio : false;
  ctl.classList.add("mv-silent");
  v.addEventListener("loadeddata", () => setTimeout(() => ctl.classList.toggle("mv-silent", !hasAudio()), 800));
  // the bead rides 2px inside either end of the channel, as sampled
  const setThumb = () => {
    const run = track.clientWidth - thumb.offsetWidth - 4;
    thumb.style.left = 2 + (v.duration && run > 0 ? Math.round(v.currentTime / v.duration * run) : 0) + "px";
  };
  const setTime = () => {
    if (!v.getAttribute("src")) return;
    $("#rp-meta").textContent = (v.videoWidth ? v.videoWidth + " × " + v.videoHeight + " · " : "") + fmtClock(v.currentTime) + " / " + fmtClock(v.duration);
  };
  v.addEventListener("timeupdate", () => { setThumb(); setTime(); });
  v.addEventListener("durationchange", () => { setThumb(); setTime(); });
  v.addEventListener("loadedmetadata", () => { setThumb(); setTime(); });
  v.addEventListener("play", () => { play.innerHTML = MVQ.pause; play.title = "Pause"; });
  v.addEventListener("pause", () => { play.innerHTML = MVQ.play; play.title = "Play"; });
  v.addEventListener("error", () => { if (v.getAttribute("src")) { $("#rp-meta").textContent = "can’t play this movie"; report("error", "the replay can’t play: " + (v.error ? "media error " + v.error.code + " " + (v.error.message || "") : "unknown"), { where: "replay" }); } });
  play.addEventListener("click", () => { if (v.paused) v.play().catch(e => setStatus(e.message, true)); else v.pause(); });
  snd.addEventListener("click", () => { v.muted = !v.muted; snd.innerHTML = v.muted ? MVQ.sndmute : MVQ.snd; });
  back.addEventListener("click", () => { v.pause(); v.currentTime = Math.max(0, v.currentTime - 1 / 30); });
  fwd.addEventListener("click", () => { v.pause(); if (v.duration) v.currentTime = Math.min(v.duration, v.currentTime + 1 / 30); });
  const seek = e => {

  const r = await fetch("/v1/workspace/Easel/" + encodeURIComponent(wsName), { method: "PUT", headers, body: blob });

function menu(x, y, items) {

    if (!it.dis) d.addEventListener("click", () => { closeMenu(); it.run(); });
    m.append(d);
  }
  document.body.append(m);
  const r = m.getBoundingClientRect();

  e.preventDefault();
  if (!row) { menu(e.clientX, e.clientY, [{ label: "New Studio…", run: newStudio }]); return; }
  await selectStudio(row.dataset.name, false);
  const s = cur(), can = !busy(s) && s.state !== "failed";
  menu(e.clientX, e.clientY, [
    { label: "Start Painter…", run: () => startSheet(s), dis: !can },
    { label: "Stop Painter", run: stopPainter, dis: s.state !== "painting" },
    "-",
    { label: "Finish…", run: () => finishSheet(s), dis: !can || !s.chunks },
    { label: "Replay…", run: () => clipSheet(s), dis: !can || !s.chunks },
    { label: "Save to Workspace", run: () => $("#b-save").click(), dis: !s.final && !s.latest },
    { label: "Copy Folder Path", run: () => navigator.clipboard?.writeText("/www/exe-art/studios/" + s.name).then(() => setStatus("Copied the folder’s path."), () => {}) },
    "-",
    { label: "Move to Trash…", run: () => trashStudio(s), dis: busy(s) },
  ]);
});
// the keyboard in the list: arrows move, Delete asks
$("#studios").addEventListener("keydown", e => {
  const i = studios.findIndex(s => s.name === sel);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const j = Math.min(studios.length - 1, Math.max(0, i + (e.key === "ArrowDown" ? 1 : -1)));
    if (studios[j]) { selectStudio(studios[j].name, false); $(`#st-list .st[data-name="${studios[j].name}"]`)?.scrollIntoView({ block: "nearest" }); }
  } else if ((e.key === "Delete" || e.key === "Backspace") && cur()) { e.preventDefault(); trashStudio(cur()); }
});

// ---- dialogs, alerts, confirms (the Hub app's blocks, through Planet) ----
function dialog(html, ok, onClose) {
  const veil = $("#veil"), dlg = $("#dlg");
  dlg.innerHTML = html;
  const scroll = document.createElement("div");
  scroll.className = "dlg-scroll";
  const btns = dlg.querySelector(":scope > .btns");
  for (const el of [...dlg.children]) if (el !== btns && el.tagName !== "H2") scroll.append(el);
  dlg.insertBefore(scroll, btns);
  veil.classList.add("on");
  const close = () => { veil.classList.remove("on"); dlg.innerHTML = ""; document.removeEventListener("keydown", onKey, true); if (onClose) onClose(); };
  const submit = async () => { if (await ok() !== false) close(); };
  const onKey = e => {
    if (veil.classList.contains("alert")) return;
    if (e.key === "Escape") { e.preventDefault(); close(); }
    else if (e.key === "Enter" && !(e.target instanceof HTMLTextAreaElement)) { e.preventDefault(); submit(); }
  };
  document.addEventListener("keydown", onKey, true);
  const c = $("#d-cancel"); if (c) c.addEventListener("click", close);
  $("#d-ok").addEventListener("click", submit);
}
let alertResolve = null;
function alertBox(message, detail, cancelLabel, okLabel) {
  if (!cancelLabel) report("warn", message + (detail ? " — " + detail : ""), { where: "alert" });
  const veil = $("#veil");
  const had = veil.classList.contains("on");
  $("#a-msg").textContent = message;
  const d = $("#a-detail"); d.textContent = detail || ""; d.hidden = !detail;
  $("#a-ok").textContent = okLabel || "OK";
  $("#a-cancel").hidden = !cancelLabel; $("#a-cancel").textContent = cancelLabel || "Cancel";
  veil.classList.add("on", "alert");
  const done = v => {
    document.removeEventListener("keydown", onKey, true);
    veil.classList.remove("alert");
    if (!had) veil.classList.remove("on");
    const r = alertResolve; alertResolve = null; if (r) r(v);
  };
  const onKey = e => { if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); done(true); } else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); done(false); } };
  document.addEventListener("keydown", onKey, true);
  $("#a-ok").onclick = () => done(true);
  $("#a-cancel").onclick = () => done(false);
  $("#a-ok").focus();
  return new Promise(r => { alertResolve = r; });
}
const confirmBox = (message, detail, okLabel) => alertBox(message, detail, "Cancel", okLabel);

// ---- live: the daemon's event stream ----
let es = null, esRetry = null, bootLoaded = false, esFails = 0;
function openStream() {
  if (es || hidden) return;
  es = new EventSource(withToken(API + "/events"));
  es.addEventListener("hello", () => {
    esFails = 0;
    if (bootLoaded) bootLoaded = false;
    else loadStudios().catch(e => setStatus("The Easel daemon isn’t answering: " + e.message, true));
  });
  es.addEventListener("studio", e => {
    let s; try { s = JSON.parse(e.data); } catch (x) { return; }
    upsert(s); maybeStartPending(s);
  });
  es.addEventListener("removed", e => { try { removeStudio(JSON.parse(e.data).name); } catch (x) {} });
  // a stream that drops (a daemon restart, a sleeping laptop) reconnects;
  // only one that keeps failing is worth a word on the status line
  es.onerror = () => {
    es.close(); es = null;
    if (++esFails >= 2) { setStatus("The Easel daemon isn’t answering; trying again…", true); if (esFails === 2) report("warn", "the event stream keeps failing", { where: "events" }); }
    clearTimeout(esRetry); esRetry = setTimeout(openStream, esFails >= 2 ? 5000 : 1000);
  };
}
function closeStream() { if (es) { es.close(); es = null; } clearTimeout(esRetry); }
// a changed studio refreshes the pane on show: the session follows, the
// canvas takes the newest look, the journal and the log reread
const _studioChanged = studioChanged;
studioChanged = function (before, s) {
  _studioChanged(before, s);
  if (!before) return;
  if (tab === "session" && (before.updated !== s.updated || before.state !== s.state)) loadSession();
  if (tab === "canvas" && (before.latest !== s.latest || before.final !== s.final || before.state !== s.state)) renderCanvas();
  if (tab === "journal" && before.updated !== s.updated) loadJournal();
  if (tab === "code" && before.chunks !== s.chunks) loadCode();
  if (tab === "easel" && before.state !== s.state) { const was = busy(before), now = busy(s); if (was !== now) ezLine("sys", now ? "The painter is at the easel. This console opens when it stops." : "The easel is free."); renderConsole(); }
  if (tab === "replay" && (before.clip !== s.clip || before.state !== s.state)) loadReplay();
  if (before.state !== s.state && ["finishing", "replaying"].includes(before.state)) {
    // what the daemon made by itself reports on the status line only
    if (s.error && before.job && before.job.auto) setStatus((before.state === "finishing" ? "The picture wasn’t finished: " : "No replay: ") + s.error.split("\n")[0], true);
    else if (s.error) alertBox(before.state === "finishing" ? "The painting couldn’t be finished." : "The replay couldn’t be made.", s.error);
    else setStatus(before.state === "finishing" ? (s.state === "replaying" ? "Finished; now making the replay…" : "Finished: the varnished picture is in Canvas → Finished.") : "The replay is ready.");
    if (before.state === "finishing" && !s.error) { view = "final"; $("#view").value = "final"; if (tab === "canvas") renderCanvas(); }
  }
};

// ---- the seam's grip, remembered per browser ----
for (const g of $$(".grip")) {
  const target = $("#" + g.dataset.for);
  const w = lsGet("w." + g.dataset.for); if (w) target.style.width = w;
  g.addEventListener("pointerdown", e => {
    e.preventDefault();
    g.setPointerCapture(e.pointerId);
    const start = e.clientX, w0 = target.getBoundingClientRect().width;
    const move = ev => { target.style.width = Math.min(420, Math.max(150, w0 + ev.clientX - start)) + "px"; };
    const up = () => { g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up); lsSet("w." + g.dataset.for, target.style.width); };
    g.addEventListener("pointermove", move); g.addEventListener("pointerup", up);
  });
}

// ---- the action row's glyphs, drawn from these rows (X = ink) ----
const GLYPHS = {
  start: ["", "   X", "   XX", "   XXX", "   XXXX", "   XXXXX", "   XXXXXX", "   XXXXXX", "   XXXXX", "   XXXX", "   XXX", "   XX", "   X", ""],
  stop: ["", "", "", "   XXXXXXXX", "   XXXXXXXX", "   XXXXXXXX", "   XXXXXXXX", "   XXXXXXXX", "   XXXXXXXX", "   XXXXXXXX", "   XXXXXXXX", "", "", ""],
  finish: ["      X", "      X", "     XXX", "     XXX", "    XXXXX", "   XXXXXXX", "   XX XXXX", "  XX XXXXXX", "  XX XXXXXX", "  XXX XXXXX", "  XXXXXXXXX", "   XXXXXXX", "    XXXXX", ""],
  clip: ["XXXXXXXXXXXXXX", "X X  X  X  X X", "XXXXXXXXXXXXXX", "X            X", "X    X       X", "X    XXX     X", "X    XXXXX   X", "X    XXX     X", "X    X       X", "X            X", "XXXXXXXXXXXXXX", "X X  X  X  X X", "XXXXXXXXXXXXXX", ""],
  save: ["XXXXXXXXXXXX", "X  XXXXXX  XX", "X  XXXX X  X X", "X  XXXX X  X X", "X  XXXXXX    X", "X            X", "X            X", "X XXXXXXXXXX X", "X X        X X", "X X        X X", "X X        X X", "X X        X X", "XXXXXXXXXXXXXX", ""],
};
function glyphSVG(rows) {
  let d = "";
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { if (r[x] !== "X") continue; let e = x; while (r[e] === "X") e++; d += `M${x} ${y}h${e - x}v1h-${e - x}z`; x = e; } });
  return `<svg class="ix" width="14" height="14" viewBox="0 0 14 14" shape-rendering="crispEdges" aria-hidden="true"><path class="k" d="${d}"/></svg>`;
}
for (const b of $$("#bar button.g")) { b.insertAdjacentHTML("beforeend", glyphSVG(GLYPHS[b.dataset.glyph])); b.setAttribute("aria-label", b.querySelector(".t").textContent); }

// ---- a phone: the list, then one studio ----
function screen(name) { document.body.dataset.screen = name; }
$("#back").addEventListener("click", () => screen("list"));
if (MOBILE) { document.body.classList.add("mobile"); screen("list"); }

// ---- desktop window plumbing ----
window.addEventListener("pointerdown", () => {
  if (window.parent !== window) parent.postMessage({ exe: "focus" }, location.origin);
}, { capture: true, passive: true });
const grow = $("#grow");
if (window.parent === window || MOBILE) grow.style.display = "none";
grow.addEventListener("pointerdown", e => {
  e.preventDefault();
  grow.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY;
  const move = ev => parent.postMessage({ exe: "grow", dx: ev.clientX - sx, dy: ev.clientY - sy }, location.origin);
  const up = () => { grow.removeEventListener("pointermove", move); grow.removeEventListener("pointerup", up); parent.postMessage({ exe: "grow-end" }, location.origin); };
  grow.addEventListener("pointermove", move); grow.addEventListener("pointerup", up);
  parent.postMessage({ exe: "grow-start" }, location.origin);
});
document.addEventListener("scroll", e => {
  const el = e.target;
  if (!(el instanceof Element)) return;
  el.classList.toggle("scrolled-y", el.scrollTop >= 1);
  el.classList.toggle("at-y-end", el.scrollTop >= 1 && el.scrollTop >= el.scrollHeight - el.clientHeight - 1);
}, { capture: true, passive: true });
// a closed window stops listening and pauses the movie; reopened, it
// catches up with everything that happened meanwhile
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.exe === "hide") { hidden = true; closeStream(); $("#rp-box video").pause(); }
  else if (e.data.exe === "show") { hidden = false; openStream(); }
});

// ---- boot ----
(async () => {
  const show = lsGet("show"); if (show) { $("#se-show").value = show; $("#se-show").dispatchEvent(new Event("change")); }
  const t = lsGet("tab"); if (t && $(`#tabs .tab[data-tab="${t}"]`)) showTab(t);
  try {
    const m = await api("/models");
    models = m.models || []; efforts = m.efforts || efforts; defaults = Object.assign(defaults, m.defaults || {});
  } catch (e) {}
  try { await loadStudios(); bootLoaded = true; }
  catch (e) { setStatus("The Easel daemon isn’t answering: " + e.message, true); renderList(); showStudio(); }
  openStream();
})();
</script>
